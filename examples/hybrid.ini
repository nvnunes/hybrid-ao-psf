[telescope]
; Set the outer diameter of the telescope pupil in unit of meters.
; OOMAO: parm.tel.D
TelescopeDiameter = 7.9

; Defines the central obstruction due to the secondary as a ratio of the TelescopeDiameter.
; OOMAO: parm.tel.obstructionRatio=1.3/7.9
ObscurationRatio = 0.1646

; Set the pointing direction of the telescope in [degrees] with respect to the zenith.
; Used to compute airmass, to scale atmospheric layers and stars altitude.
ZenithAngle = 20.0

; Diameter of the technical field of view in [arcsec].
;   In MCAO/LGS configurations, used when NumberActuators from [DM] section is not set: scales the projected DM
;   size with altitude and derives the actuator count from DmPitchs.
;   In LO, also sets the angular range for interpolating additional low-order error terms (extraErrorLoNm).
;   Warning: Mandatory and no default if LO section is used.
; OOMAO: parm.tel.fieldOfViewInArcsec
TechnicalFoV = 121


[atmosphere]
; Set the atmosphere Fried parameter r0 in [meters]. Used directly if Seeing is not provided.
r0_Value = 0.186132

; Wavelength at which the atmospheric statistics are defined in [meters].
; OOMAO: parm.atm.photometry = photometry.V0 = 0.500e-6
Wavelength = 500e-9

; Outer scale in [meters]
; OOMAO: parm.atm.L0
L0 = 30.0

; Relative contribution of each layer. The sum of all the list element must be 1. Must have the same length as Cn2Heights,
; WindSpeed and WindDirection. Warning: required if Cn2Heights, WindSpeed or WindDirection are defined.
; OOMAO: parm.atm.fractionnalR0 which is actually Cn2 weights based on how it is used in the code
Cn2Weights = [0.4557,0.1295,0.0442,0.0506,0.1167,0.0926,0.1107]

; Altitude of layers in [meters]. Must have the same length as Cn2Weights, WindSpeed and WindDirection.
; Warning: required if Cn2Weights, WindSpeed or WindDirection are defined.
; OOMAO: parm.atm.altitude
Cn2Heights = [0,500,1000,2000,4000,8000,16000]

; Wind speed values for each layer in [m/s]. Must have the same length as Cn2Weights, Cn2Heights and WindDirection.
; Warning: required if Cn2Weights, Cn2Heights or WindDirection are defined.
; OOMAO: parm.atm.windSpeed
WindSpeed = [5.6,5.77,6.25,7.57,13.31,19.06,12.14]
WindDirection = [0,0,0,0,0,0,0]


[sources_LO]
; Sensing wavelength for Low Order modes in [meters].
; OOMAO: parm.nGs.photometry = photometry.I4b = 0.710e-6
Wavelength = [710e-9]
Zenith = [30.0, 30.0, 30.0]
Azimuth = [0.0, 120.0, 240.0]


[sensor_LO]
; LO WFS pixel scale in [mas].
; OOMAO: ps=wvl/(2*dsub)*binFactor where nLenslet=1, dsub=D/nLenslet=7.9/1=7.9, binFactor=30 (see below) -> ps = 0.710e-6/(2*7.9)*30 rad = 278.1 mas
PixelScale = 278.1

; Number of WFS lenslets. Must be the same length as NumberPhotons.
; OOMAO: parm.lowfs.nLenslet
NumberLenslets = [1, 1, 1]

; Read out noise in [e-]. Default: 0.0
; OOMAO: parm.lowfs.ron
SigmaRON = 0.5

; Dark current [e-/s/pix]. Default: 0.0
Dark = 0.0

; Sky background [e-/s/pix]. Default: 0.0
SkyBackground = 0.0

; Excess noise factor. Default: 1.0
ExcessNoiseFactor = 1.0

; Radius in pixel of the FWHM of the weights map of the weighted CoG the low order WFS pixels.
; Warning: if set to 'optimize', gain is automatically optimized by TipTop (closest int to half of PSF FWHM), otherwise the float value set is used.
WindowRadiusWCoG = 2.75

; Threshold Number of pixels for windowing the low order WFS pixels. Default: 0.0
ThresholdWCoG = 0.5

; New value for pixels lower than threshold. Default: 0.0
NewValueThrPix = 0.0


[DM]
; DM altitude in meters. Must be the same length as NumberActuators and DmPitchs. Default: [0.0]
DmHeights = [0.0]


[RTC]
; High Order Loop gain. Default: 0.5
LoopGain_HO = 0.5

; High Order loop frequency in [Hz]. Default: 500.0
; OOMAO: 1/parm.tel.samplingTime
SensorFrameRate_HO = 500.0

; High Order loop delay in [frame]. Default: 2
; OOMAO: dm.coefs = u_km1 at end of loop to be used in frame so total of 2 frame delay inherent in algorithm
LoopDelaySteps_HO = 2

; Low Order loop gain. Default: None
; Warning: if set to ‘optimize’, gain is automatically optimized by TipTop, otherwise the float value set is used.
LoopGain_LO =  0.3

; Loop frequency in [Hz]. If [sensor_LO] section is present it must be set. Default: None
; OOMAO: same as high order loop
SensorFrameRate_LO = 500.0

; Low Order loop delays in [frames]. If [sensor_LO] section is present it must be set. Default: None
; OOMAO: same as high order loop
LoopDelaySteps_LO = 2

; Enables the MMSE reconstructor for the LO loop. If False, a Tikhonov reconstruction is used with λ = 0.05 (empirical value chosen to remove
; unseen modes when fewer than 3 stars or poor asterism geometry are present). Ignored if only one guide star. Default: True
MMSE_Rec_LO = True


[sources_science]
Wavelength = [1.654e-6]
Zenith = [0.0, 36.0, 60.0]
Azimuth = [0.0, 0.0, 0.0]


[hybrid]
science_psf_artifact = products/science.pkl
ngs_metric_artifact = products/ngs.pkl
output = results/hybrid.h5
ngs_flux_photon_per_s = [7.744945e7, 7.744945e7, 7.744945e7]
non_psd_policy = error
diagnostics_level = debug
